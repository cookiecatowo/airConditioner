services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-app
    restart: always
    ports:
      - "80:8080"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    networks:
      - air-network

networks:
  air-network:
    driver: bridge
